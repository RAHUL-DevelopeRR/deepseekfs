name: Retrieval regression

on:
  push:
    branches: [main, codex/ui-ux-unique-icons]
  pull_request:

jobs:
  retrieval:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      QT_QPA_PLATFORM: offscreen
      NEURON_STORAGE_DIR: ${{ runner.temp }}/neucockpit-retrieval-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: >-
          python -m pip install pytest pytest-timeout faiss-cpu numpy watchdog
          PyMuPDF python-docx python-pptx openpyxl pillow dateparser requests rich jinja2
      - name: Verify chunk retrieval, persistence, grounding and model selection
        run: >-
          python -m pytest tests/test_chunk_retrieval.py tests/test_model_manager_cache.py
          tests/test_folder_indexing.py tests/test_tool_permissions.py tests/test_startup_indexer.py
          -q --timeout=40
